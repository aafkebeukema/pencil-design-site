[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[context.staging.environment]
  PUBLIC_NO_INDEX = "true"

[[redirects]]
  from = "/api/contact-assistant"
  to = "/.netlify/functions/contact-assistant"
  status = 200

[[redirects]]
  from = "/services"
  to = "/private-clients/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/private-clients/"
  status = 301
